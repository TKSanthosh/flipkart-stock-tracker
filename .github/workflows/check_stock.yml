name: Flipkart Vivo X200T Stock Monitor

on:
  schedule:
    # Runs every hour at minute 0 (e.g. 1:00, 2:00, etc.)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send test email alert to verify configuration'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'tksanthosh494@gmail.com' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'santhosh-vivo-x200t-stock' }}
        run: |
          if [ "${{ github.event.inputs.test_alert }}" = "true" ]; then
            python main.py --test
          else
            python main.py
          fi

      - name: Commit & Push Status State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_status.json
          git diff --staged --quiet || (git commit -m "chore: update stock status [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
