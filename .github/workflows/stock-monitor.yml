name: Flipkart Vivo X200T Stock Monitor

on:
  schedule:
    # Run every 5 minutes (shortest interval supported by GitHub Actions cron)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test notification to verify email & push setup'
        type: boolean
        required: false
        default: false
      force_alert:
        description: 'Force send alert for available items even if previously alerted'
        type: boolean
        required: false
        default: false
      burst_minutes:
        description: 'Optional: Run continuous 30-sec polling loop for N minutes (0 = single check)'
        type: number
        required: false
        default: 0

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Monitor
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'tksanthosh494@gmail.com' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.test_alert }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          if [ "${{ github.event.inputs.force_alert }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          BURST="${{ github.event.inputs.burst_minutes }}"
          if [ -n "$BURST" ] && [ "$BURST" -gt "0" ] 2>/dev/null; then
            echo "Starting continuous 30-second polling burst for $BURST minute(s)..."
            timeout ${BURST}m python main.py --interval 30 || true
          else
            python main.py $ARGS
          fi

      - name: Commit and Push Status
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_status.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(tracker): update stock state [skip ci]" || exit 0
            git pull --rebase origin main || true
            git push origin main || true
          fi
