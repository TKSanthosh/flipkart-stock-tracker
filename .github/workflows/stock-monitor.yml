name: Flipkart Vivo X200T Stock Monitor

on:
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test notification to verify email & push setup'
        type: boolean
        required: false
        default: false
      force_alert:
        description: 'Force send alert for available items even if previously alerted'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'tksanthosh494@gmail.com' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.test_alert }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          if [ "${{ github.event.inputs.force_alert }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python main.py $ARGS

      - name: Commit and Push Status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_status.json
          git diff --staged --quiet || (git commit -m "chore(tracker): update stock state [skip ci]" && git push)
